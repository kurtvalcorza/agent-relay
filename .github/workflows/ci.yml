name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - run: python -m compileall -q scripts tests
      # `python -m pytest` (not bare `pytest`) is required: the tests import
      # `scripts.*`, and only the -m form puts the repository root on sys.path.
      - run: python -m pytest
      # Keep stdlib discovery green because Agent Relay advertises it as a
      # dependency-free verification path.
      - run: python -m unittest discover -s tests -t . -v
      # Regression for PR #12: the main guard must remain below every v0.4 test
      # class so direct module execution cannot silently skip later tests.
      - run: python -m tests.test_protocol_v04
